<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registeration Form</title>
</head>
<body bgcolor="pink">
    <Form>
<Header><h1>STUDENT REGISTERATION</h1></Header>
<h3>
FIRST NAME <input type="text"><br>
<br>
LAST NAME <input type="text"><br>
<br>
DATE OF BIRTH <input type="date"><br>
<br>
EMAIL ID <input type="email"><br>
<br>
MOBILE NUMBER <input type="number"><br>
<br>
GENDER:-<label for="male">Male</label>
<input type="radio" id="Male" name="Gender">
<label for="Female">Female</label>
<input type="radio" name="Gender" id="Female"><br>
<br>
ADDRESS <textarea name="address" id="address" cols="40" rows="4"></textarea><br>
<br>
CITY <input type="text"><br>
<br>
PIN CODE <input type="number"><br>
<br>
STATE <input type="text"><br>
<br>
COUNTRY <input type="Country" placeholder="India"><br>
<br>
HOBBIES:- <label for="drawing">Drawing</label>
<input type="checkbox" name="hobbies" id="Drawing">
<label for="singing">Singing</label>
<input type="checkbox" name="hobbies" id="Singing">
<label for="dancing">Dancing</label>
<input type="checkbox" name="hobbies" id="Dancing">
<label for="sketching">Sketching</label>
<input type="checkbox" name="hobbies" id="Sketching">
<label for="others">others</label>
<input type="checkbox" name="hobbies" id="Others">
<input type="text"><br>
<br>
<table title="Qualification">QUALIFICATION:-
    <tr>
        <th>SI.No</th>
        <th>Examination</th>
        <th>Board</th>
        <th>Percentage</th>
        <th>Year of Passing</th>
    </tr>
    <tr>
        <td>1</td>
        <td>Class X</td>
       <td><input type="text"></td>
       <td><input type="text"></td>
       <td><input type="text"></td>
    </tr>
    <tr>
        <td>2</td>
        <td>Class XII</td>
        <td> <input type="text"></td>
        <td> <input type="text"></td>
        <td> <input type="text"></td>
    </tr>
    <tr>
        <td>3</td>
        <td>Graduation</td>
        <td> <input type="text"></td>
        <td> <input type="text"></td>
        <td> <input type="text"></td>
    </tr>
    <tr>
        <td>4</td>
        <td>Masters</td>
        <td> <input type="text"></td>
        <td> <input type="text"></td>
        <td> <input type="text"></td>
    </tr>
</table><br>
<br>
COURSES APPLIED FOR:- <label for="BCA">BCA</label>
<input type="radio" name="courses" id="BCA">
<label for="B.Com">B.Com</label>
<input type="radio" name="courses" id="B.Com">
<label for="B.Sc">B.Sc</label>
<input type="radio" name="courses" id="B.Sc">
<label for="B.A">B.A</label>
<input type="radio" name="courses" id="B.A"><br>
<br>
<center><button>Submit</button>
<button>Reset</button></center>








</h3>
</Form>  
</body>
</html>
